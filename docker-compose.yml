version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: learninghun-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: learninghun
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: learninghun-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learninghun-backend
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: learninghun
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learninghun-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  mysql_data:

